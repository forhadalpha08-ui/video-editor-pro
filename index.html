<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>VidoEdit Pro - Turn Ideas Into Videos</title>
    <meta name="description" content="VidoEdit Pro - Professional creative video editor with real multi-track timeline, visual effects, chroma key, and 4K export." />
    <meta property="og:title" content="VidoEdit Pro - Professional Video Editor" />
    <meta property="og:description" content="Professional creative video editor with real multi-track timeline, visual effects, chroma key, and 4K export." />
    <meta name="theme-color" content="#020306" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta property="og:type" content="website" />

  <body style="margin: 0; background-color: #020306; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #070c24 0%, #020306 100%);">
        <div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); filter: blur(12px); opacity: 0.6; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>

        <div style="margin-top: 16px; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; color: #ffffff;">
          VidoEdit<span style="color: #38bdf8;">Pro</span>
        </div>
        <div style="margin-top: 6px; font-size: 9px; font-family: monospace; letter-spacing: 2px; color: #64748b; text-transform: uppercase;">
          Loading Creative Suite...
        </div>

    </div>
    <script type="module" src="/src/main.tsx"></script>
